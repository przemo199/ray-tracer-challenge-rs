# Texture mapping: one UV pattern per mapping, plus an align check whose
# colored corners show which way u and v run on a cylinder.

- add: camera
  width: 3840
  height: 2560
  field-of-view: 1.0
  from: [0, 1.8, -6]
  to: [0, 0.6, 0]
  up: [0, 1, 0]

- add: light
  at: [-6, 10, -10]
  intensity: [1, 1, 1]

- define: glossy-material
  value:
    specular: 0.4
    shininess: 100

# floor: planar mapping repeats the texture every unit
- add: plane
  material:
    extend: glossy-material
    reflective: 0.1
    pattern:
      type: map
      mapping: planar
      uv_pattern:
        type: checkers
        width: 2
        height: 2
        colors: [[0.9, 0.9, 0.9], [0.25, 0.35, 0.6]]

# left: spherical mapping, 16 checkers around and 8 from pole to pole
- add: sphere
  transform:
    - [translate, -1.6, 1, 0]
  material:
    extend: glossy-material
    pattern:
      type: map
      mapping: spherical
      uv_pattern:
        type: checkers
        width: 16
        height: 8
        colors: [[0.1, 0.55, 0.2], [1, 1, 1]]

# right: cylindrical mapping, wrapping once around and repeating every unit of height
- add: cylinder
  min: 0
  max: 1
  closed: true
  transform:
    - [scale, 0.9, 2.4, 0.9]
    - [translate, 1.6, 0, 0.5]
  material:
    extend: glossy-material
    pattern:
      type: map
      mapping: cylindrical
      uv_pattern:
        type: checkers
        width: 12
        height: 3
        colors: [[0.8, 0.3, 0.2], [1, 0.9, 0.7]]

# back: align check; its u = 0 seam faces the camera (-z). From the camera's view,
# yellow (upper right) and cyan (bottom right) are left of the seam, red (upper
# left) and green (bottom left) right of it
- add: cylinder
  min: 0
  max: 1
  transform:
    - [scale, 0.8, 1.6, 0.8]
    - [translate, 0, 0.3, 3.5]
  material:
    extend: glossy-material
    pattern:
      type: map
      mapping: cylindrical
      uv_pattern:
        type: align_check
        colors:
          main: [0.9, 0.9, 0.9]
          ul: [1, 0, 0]
          ur: [1, 1, 0]
          bl: [0, 1, 0]
          br: [0, 1, 1]

# front: cube mapping, one align check per face (mapped as seen from inside the
# cube, so from outside each face appears mirrored)
- add: cube
  transform:
    - [scale, 0.4, 0.4, 0.4]
    - [rotate-y, -0.6]
    - [translate, 0, 0.4, -1.8]
  material:
    extend: glossy-material
    pattern:
      type: map
      mapping: cube
      left:
        type: align_check
        colors: { main: [1, 0.5, 0], ul: [1, 0, 0], ur: [1, 1, 0], bl: [0, 1, 0], br: [0, 1, 1] }
      front:
        type: align_check
        colors: { main: [0.5, 0, 0.5], ul: [1, 0, 0], ur: [1, 1, 0], bl: [0, 1, 0], br: [0, 1, 1] }
      right:
        type: align_check
        colors: { main: [0.4, 0.4, 0.4], ul: [1, 0, 0], ur: [1, 1, 0], bl: [0, 1, 0], br: [0, 1, 1] }
      back:
        type: align_check
        colors: { main: [0.2, 0.3, 1], ul: [1, 0, 0], ur: [1, 1, 0], bl: [0, 1, 0], br: [0, 1, 1] }
      up:
        type: align_check
        colors: { main: [1, 1, 1], ul: [1, 0, 0], ur: [1, 1, 0], bl: [0, 1, 0], br: [0, 1, 1] }
      down:
        type: align_check
        colors: { main: [0, 0, 0], ul: [1, 0, 0], ur: [1, 1, 0], bl: [0, 1, 0], br: [0, 1, 1] }
