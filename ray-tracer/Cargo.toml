[package]
name = "ray-tracer"
version = "0.1.0"
authors = ["Przemyslaw Kaminski <przemyslaw.m.kaminski@gmail.com>"]
edition = "2024"

[lints]
workspace = true

# the lib's libtest harness would reject Criterion arguments such as --save-baseline
[lib]
bench = false

[dependencies]
image.workspace = true
indicatif.workspace = true
rayon.workspace = true

[dev-dependencies]
rstest.workspace = true
criterion.workspace = true

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "shapes"
harness = false
