[workspace]
members = ["ray-tracer", "ray-tracer-cli"]
resolver = "2"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# PNG output and JPEG/PNG texture input only; the default formats (AVIF, EXR, TIFF, WebP, ...) double the dependency tree
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
indicatif = { version = "0.18.6", features = ["rayon"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
rstest = "0.28.0"
# Benchmarks only. `plotters` (charts) is left out to keep compile times down.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Project style: every function ends with an explicit `return` (see AGENTS.md).
needless_return = "allow"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
