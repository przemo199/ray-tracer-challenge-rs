[workspace]
members = ["ray-tracer", "ray-tracer-cli"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.5.48", features = ["derive"] }
image = { version = "0.25.8", features = ["rayon", "png"] }
indicatif = { version = "0.18.0", features = ["rayon"] }
rayon = "1.11.0"
yaml-rust2 = "0.10.4"
rstest = "0.26.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
